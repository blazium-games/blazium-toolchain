name: Build and Sign Toolchain

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  resolve-version:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      simple_version: ${{ steps.finalize.outputs.simple_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize version (0.1.0 baseline + CDN monotonic)
        id: finalize
        run: |
          set -euo pipefail
          COMPUTED="${{ steps.version.outputs.simple_version }}"
          BASE="0.1.0"
          CDN_LATEST="$(curl -fsSL -H 'Cache-Control: no-cache' https://cdn.blazium.app/toolchain/toolchain.json | jq -r '.latest // empty' || true)"
          NPM_LATEST="$(curl -fsSL -H 'Cache-Control: no-cache' https://registry.npmjs.org/@blazium-engine%2ftoolchain/latest | jq -r '.version // empty' || true)"
          if [[ "$CDN_LATEST" == "null" ]]; then
            CDN_LATEST=""
          fi
          if [[ "$NPM_LATEST" == "null" ]]; then
            NPM_LATEST=""
          fi

          CANDIDATE="$(printf '%s\n%s\n' "$COMPUTED" "$BASE" | sort -V | tail -n1)"

          bump_patch() {
            local v="$1"
            local major minor patch
            IFS=. read -r major minor patch <<< "$v"
            patch="${patch%%[^0-9]*}"
            echo "${major}.${minor}.$((patch + 1))"
          }

          FLOOR="$(printf '%s\n%s\n' "$CDN_LATEST" "$NPM_LATEST" | sed '/^$/d' | sort -V | tail -n1 || true)"
          if [[ -n "$FLOOR" ]]; then
            HIGHER="$(printf '%s\n%s\n' "$CANDIDATE" "$FLOOR" | sort -V | tail -n1)"
            if [[ "$HIGHER" == "$FLOOR" ]]; then
              CANDIDATE="$(bump_patch "$FLOOR")"
            fi
          fi

          occupied() {
            local v="$1"
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://cdn.blazium.app/toolchain/${v}/toolchain.json" || true)"
            if [[ "$code" == "200" ]]; then
              return 0
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://registry.npmjs.org/@blazium-engine%2ftoolchain/${v}" || true)"
            [[ "$code" == "200" ]]
          }
          for _ in 1 2 3 4 5 6 7 8; do
            if occupied "$CANDIDATE"; then
              echo "occupied ${CANDIDATE}"
              CANDIDATE="$(bump_patch "$CANDIDATE")"
            else
              break
            fi
          done

          echo "computed=${COMPUTED} base=${BASE} cdn_latest=${CDN_LATEST:-none} npm_latest=${NPM_LATEST:-none} => ${CANDIDATE}"
          echo "simple_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"

  ps2-compile:
    name: PS2 compile hello (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: blazium-toolchain
          - os: windows-latest
            bin: blazium-toolchain.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Build CLI
        run: go build -o ${{ matrix.bin }} ./cmd/blazium-toolchain
      - name: ps2 setup compile
        run: ./${{ matrix.bin }} ps2 setup --profile compile
      - name: ps2 build hello
        run: ./${{ matrix.bin }} ps2 build --out hello.elf
      - name: Verify MIPS ELF and size gates
        shell: pwsh
        run: |
          $bin = "${{ matrix.bin }}"
          if (-not (Test-Path -LiteralPath $bin)) { throw "missing $bin" }
          $bytes = [System.IO.File]::ReadAllBytes("hello.elf")
          if ($bytes.Length -lt 20 -or $bytes[0] -ne 0x7F -or [Text.Encoding]::ASCII.GetString($bytes, 1, 3) -ne "ELF") {
            throw "hello.elf is not an ELF"
          }
          $mach = [BitConverter]::ToUInt16($bytes, 18)
          if ($mach -ne 8 -and $mach -ne 0) { throw "hello.elf e_machine=$mach (want MIPS=8)" }
          $info = & "./$bin" ps2 elf-info hello.elf
          if ($LASTEXITCODE -ne 0) { throw "ps2 elf-info failed" }
          $text = [int64]0
          foreach ($line in @($info)) {
            if ("$line" -match 'text_bytes=(\d+)') { $text = [int64]$Matches[1] }
          }
          if ($text -le 0) { throw "elf-info missing text_bytes= ($info)" }
          if ($text -gt 524288) { throw "hello.elf .text $text exceeds 512 KiB" }
          if ($bytes.Length -gt 3145728) { throw "hello.elf file $($bytes.Length) exceeds 3 MiB" }
          Write-Host "hello.elf ok text_bytes=$text file_bytes=$($bytes.Length)"

  n64-compile:
    name: N64 compile hello (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: blazium-toolchain
          - os: windows-latest
            bin: blazium-toolchain.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Build CLI
        run: go build -o ${{ matrix.bin }} ./cmd/blazium-toolchain
      - name: n64 setup compile
        run: ./${{ matrix.bin }} n64 setup --profile compile
      - name: n64 build hello
        run: ./${{ matrix.bin }} n64 build --out hello.z64
      - name: Verify big-endian .z64 and size gates
        shell: pwsh
        run: |
          $bin = "${{ matrix.bin }}"
          if (-not (Test-Path -LiteralPath $bin)) { throw "missing $bin" }
          if (-not (Test-Path -LiteralPath "hello.z64")) { throw "hello.z64 was not written" }
          $bytes = [System.IO.File]::ReadAllBytes("hello.z64")
          if ($bytes.Length -lt 4096) { throw "hello.z64 too small: $($bytes.Length)" }
          if ($bytes.Length -gt 67108864) { throw "hello.z64 exceeds 64 MiB cart budget: $($bytes.Length)" }
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            throw "hello.z64 starts with MZ (PE)"
          }
          if ($bytes.Length -ge 4 -and $bytes[0] -eq 0x7F -and $bytes[1] -eq 0x45 -and $bytes[2] -eq 0x4C -and $bytes[3] -eq 0x46) {
            throw "hello.z64 is ELF; product must be big-endian .z64"
          }
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x80 -or $bytes[1] -ne 0x37 -or $bytes[2] -ne 0x12 -or $bytes[3] -ne 0x40) {
            throw "hello.z64 magic is not 80 37 12 40"
          }
          Write-Host "hello.z64 ok file_bytes=$($bytes.Length)"

  ps1-compile:
    name: PS1 compile hello (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: blazium-toolchain
          - os: windows-latest
            bin: blazium-toolchain.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Install make cmake ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Build CLI
        run: go build -o ${{ matrix.bin }} ./cmd/blazium-toolchain
      - name: ps1 setup compile
        run: ./${{ matrix.bin }} ps1 setup --profile compile
      - name: ps1 build hello
        run: ./${{ matrix.bin }} ps1 build --out hello.exe
      - name: Verify PS-X EXE
        shell: pwsh
        run: |
          $bin = "${{ matrix.bin }}"
          if (-not (Test-Path -LiteralPath $bin)) { throw "missing $bin" }
          if (-not (Test-Path -LiteralPath "hello.exe")) { throw "hello.exe was not written" }
          $bytes = [System.IO.File]::ReadAllBytes("hello.exe")
          if ($bytes.Length -lt 2048) { throw "hello.exe too small: $($bytes.Length)" }
          if ($bytes.Length -gt 2097152) { throw "hello.exe exceeds 2 MiB PS1 RAM budget: $($bytes.Length)" }
          $magic = [Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(8, $bytes.Length))
          if ($magic -ne "PS-X EXE") { throw "hello.exe magic is '$magic' (want PS-X EXE)" }
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            throw "hello.exe starts with MZ (host PE)"
          }
          Write-Host "hello.exe ok file_bytes=$($bytes.Length)"

  interdvd-setup:
    name: Interactive DVD setup (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: blazium-toolchain
          - os: windows-latest
            bin: blazium-toolchain.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Build CLI
        run: go build -o ${{ matrix.bin }} ./cmd/blazium-toolchain
      - name: interdvd setup
        run: ./${{ matrix.bin }} interdvd setup
      - name: interdvd status
        run: ./${{ matrix.bin }} interdvd status

  build:
    needs: [resolve-version]
    if: ${{ !cancelled() && (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            hub_arch: x86_64
            output: blazium-toolchain
          - goos: linux
            goarch: 386
            hub_arch: x86_32
            output: blazium-toolchain
          - goos: windows
            goarch: amd64
            hub_arch: x86_64
            output: blazium-toolchain.exe
          - goos: windows
            goarch: 386
            hub_arch: x86_32
            output: blazium-toolchain.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"

      - name: Build application
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          mkdir -p build
          go build -trimpath -ldflags "-s -w -X github.com/blazium-games/blazium-toolchain/internal/app.Version=${{ needs.resolve-version.outputs.simple_version || '0.0.0' }}" \
            -o "./build/${{ matrix.output }}" ./cmd/blazium-toolchain

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: build/${{ matrix.output }}

  validate:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Require every build artifact
        run: |
          set -euo pipefail
          find_bin() {
            local dir="$1" name="$2"
            if [ -f "${dir}/${name}" ] || [ -f "${dir}/build/${name}" ]; then
              return 0
            fi
            echo "missing ${dir}/${name}" >&2
            return 1
          }
          find_bin artifacts/linux/x86_64 blazium-toolchain
          find_bin artifacts/linux/x86_32 blazium-toolchain
          find_bin artifacts/windows/x86_64 blazium-toolchain.exe
          find_bin artifacts/windows/x86_32 blazium-toolchain.exe

  sign:
    needs: [validate, test, ps1-compile, ps2-compile, n64-compile, interdvd-setup]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            hub_arch: x86_64
            output: blazium-toolchain
          - goos: linux
            hub_arch: x86_32
            output: blazium-toolchain
          - goos: windows
            hub_arch: x86_64
            output: blazium-toolchain.exe
          - goos: windows
            hub_arch: x86_32
            output: blazium-toolchain.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: build

      - name: Flatten build artifact
        run: |
          set -euo pipefail
          if [ -f "build/build/${{ matrix.output }}" ]; then
            mv "build/build/${{ matrix.output }}" "build/${{ matrix.output }}"
            rmdir build/build || true
          fi
          test -f "build/${{ matrix.output }}"

      - name: Install GPG
        if: ${{ matrix.goos != 'windows' }}
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Import GPG key
        if: ${{ matrix.goos != 'windows' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: GPG Signing build
        if: ${{ matrix.goos != 'windows' }}
        run: |
          gpg --batch --yes \
            --output build/${{ matrix.output }}.sig --detach-sign build/${{ matrix.output }}

      - name: Prepare signed dir (Windows)
        if: ${{ matrix.goos == 'windows' }}
        run: mkdir -p signed

      - uses: bioblaze/sslcom-code-signer@v6
        name: Windows Signing
        if: ${{ matrix.goos == 'windows' }}
        continue-on-error: true
        id: windows_sign
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/${{ matrix.output }}
          output_path: ./signed
          environment_name: PROD

      - name: Prepare Windows artifact
        if: ${{ matrix.goos == 'windows' }}
        id: windows_artifact
        run: |
          set -euo pipefail
          mkdir -p signed
          DEST="./signed/${{ matrix.output }}"
          if [ -f "$DEST" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif SIGNED="$(find ./signed -type f -name '${{ matrix.output }}' | head -n 1)" && [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$DEST"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Windows code signing failed; keeping unsigned build artifact." >&2
            cp "./build/${{ matrix.output }}" "$DEST"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Windows signing
        if: ${{ matrix.goos == 'windows' }}
        run: |
          if [[ "${{ steps.windows_artifact.outputs.signed }}" == "true" ]]; then
            echo sslcom > signed/signing.txt
          else
            echo unsigned > signed/signing.txt
          fi

      - name: Upload artifacts (unix)
        uses: actions/upload-artifact@v4
        if: ${{ matrix.goos != 'windows' }}
        with:
          name: signed-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: |
            build/blazium-toolchain
            build/blazium-toolchain.sig

      - name: Upload artifacts (windows)
        uses: actions/upload-artifact@v4
        if: ${{ matrix.goos == 'windows' }}
        with:
          name: signed-windows-${{ matrix.hub_arch }}
          path: |
            signed/blazium-toolchain.exe
            signed/signing.txt

  manifest:
    needs: [resolve-version, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Normalize artifact layout
        run: |
          set -euo pipefail
          normalize_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          for d in artifacts/linux/x86_64 artifacts/linux/x86_32 artifacts/windows/x86_64 artifacts/windows/x86_32; do
            normalize_dir "$d"
          done
          ls -laR artifacts/

      - name: Require every signed artifact
        run: |
          set -euo pipefail
          test -f artifacts/linux/x86_64/blazium-toolchain
          test -f artifacts/linux/x86_64/blazium-toolchain.sig
          test -f artifacts/linux/x86_32/blazium-toolchain
          test -f artifacts/linux/x86_32/blazium-toolchain.sig
          test -f artifacts/windows/x86_64/blazium-toolchain.exe
          test -f artifacts/windows/x86_32/blazium-toolchain.exe

      - name: Download existing manifest
        continue-on-error: true
        run: curl -fsSL https://cdn.blazium.app/toolchain/toolchain.json -o existing-toolchain.json

      - name: Generate toolchain.json
        env:
          CEREBRO_MANIFEST: ${{ secrets.CEREBRO_URL }}/api/v1/tools/toolchain/manifest
        run: |
          ARGS=(--version "${{ needs.resolve-version.outputs.simple_version }}" --artifacts artifacts --out toolchain.json)
          if [ -f existing-toolchain.json ]; then
            ARGS+=(--base-manifest existing-toolchain.json)
          fi
          if [ -n "$CEREBRO_MANIFEST" ]; then
            ARGS+=(--cerebro-manifest "$CEREBRO_MANIFEST")
          fi
          go run ./cmd/generate-toolchain-manifest "${ARGS[@]}"

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: toolchain.json
          out_dir: toolchain

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: toolchain.json
          out_dir: toolchain/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-toolchain
          out_dir: toolchain/linux/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-toolchain
          out_dir: toolchain/linux/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-toolchain.sig
          out_dir: toolchain/linux/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-toolchain.sig
          out_dir: toolchain/linux/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-toolchain
          out_dir: toolchain/linux/x86_32

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-toolchain
          out_dir: toolchain/linux/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-toolchain.sig
          out_dir: toolchain/linux/x86_32

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-toolchain.sig
          out_dir: toolchain/linux/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_64/blazium-toolchain.exe
          out_dir: toolchain/windows/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_64/blazium-toolchain.exe
          out_dir: toolchain/windows/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_32/blazium-toolchain.exe
          out_dir: toolchain/windows/x86_32

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_32/blazium-toolchain.exe
          out_dir: toolchain/windows/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - name: Verify toolchain.json checksums
        run: |
          chmod +x scripts/verify-toolchain-manifest.sh
          scripts/verify-toolchain-manifest.sh \
            --manifest toolchain.json \
            --version "${{ needs.resolve-version.outputs.simple_version }}" \
            --artifacts artifacts

      - name: Register with Cerebro
        env:
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          register() {
            local os="$1" arch="$2" file="$3" signing="$4"
            local url="https://cdn.blazium.app/toolchain/${os}/${arch}/${VERSION}/$(basename "$file")"
            local sig=""
            if [[ "$signing" == "gpg" ]]; then
              sig="${url}.sig"
            elif [[ "$signing" == "unsigned" ]]; then
              signing=""
            fi
            local sha size
            sha=$(sha256sum "$file" | awk '{print $1}')
            size=$(stat -c%s "$file")
            curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
              -H "Content-Type: application/json" \
              -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
              -d "$(cat <<EOF
          {
            "name": "Blazium Toolchain",
            "type": "toolchain",
            "version": "${VERSION}",
            "os": "${os}",
            "arch": "${arch}",
            "file": "${url}",
            "sig": "${sig}",
            "sha256": "${sha}",
            "size": ${size},
            "signing": "${signing}",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"
          }
          win_signing() {
            local arch="$1"
            local marker="artifacts/windows/${arch}/signing.txt"
            if [[ -f "$marker" && "$(tr -d '[:space:]' < "$marker")" == "sslcom" ]]; then
              echo sslcom
            else
              echo unsigned
            fi
          }
          register linux x86_64 artifacts/linux/x86_64/blazium-toolchain gpg
          register linux x86_32 artifacts/linux/x86_32/blazium-toolchain gpg
          register windows x86_64 artifacts/windows/x86_64/blazium-toolchain.exe "$(win_signing x86_64)"
          register windows x86_32 artifacts/windows/x86_32/blazium-toolchain.exe "$(win_signing x86_32)"

  publish-npm:
    needs: [resolve-version, sign]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Stage platform binaries
        env:
          BLAZIUM_TOOLCHAIN_VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          test -n "$BLAZIUM_TOOLCHAIN_VERSION"
          normalize_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          for d in artifacts/linux/x86_64 artifacts/linux/x86_32 artifacts/windows/x86_64 artifacts/windows/x86_32; do
            normalize_dir "$d"
          done
          install_bin() {
            local src="$1"
            local dest_dir="$2"
            local dest_name="$3"
            test -f "$src"
            mkdir -p "$dest_dir"
            cp "$src" "${dest_dir}/${dest_name}"
            chmod +x "${dest_dir}/${dest_name}"
          }
          install_bin artifacts/linux/x86_64/blazium-toolchain npm/packages/toolchain-linux-x64/bin blazium-toolchain
          install_bin artifacts/linux/x86_32/blazium-toolchain npm/packages/toolchain-linux-ia32/bin blazium-toolchain
          install_bin artifacts/windows/x86_64/blazium-toolchain.exe npm/packages/toolchain-win32-x64/bin blazium-toolchain.exe
          install_bin artifacts/windows/x86_32/blazium-toolchain.exe npm/packages/toolchain-win32-ia32/bin blazium-toolchain.exe
          stage_docs() {
            local wrapper="$1"
            local scope="$2"
            local dir name rest os cpu
            for dir in npm/packages/"${wrapper}" npm/packages/"${wrapper}"-*; do
              cp LICENSE "${dir}/LICENSE"
              name=$(basename "$dir")
              if [ "$name" = "$wrapper" ]; then
                cp README.md "${dir}/README.md"
                continue
              fi
              rest="${name#"${wrapper}"-}"
              os="${rest%-*}"
              cpu="${rest#*-}"
              {
                echo "This package is the native ${os} ${cpu} binary for ${scope}."
                echo
                echo "Install \`${scope}\` instead of this package."
                echo
                cat README.md
              } > "${dir}/README.md"
            done
          }
          stage_docs toolchain "@blazium-engine/toolchain"
          node npm/stamp-versions.cjs "${{ needs.resolve-version.outputs.simple_version }}"

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          for pkg in toolchain-linux-x64 toolchain-linux-ia32 toolchain-win32-x64 toolchain-win32-ia32 toolchain; do
            npm publish --access public "npm/packages/${pkg}"
          done

  github-release:
    name: GitHub Release
    needs: [resolve-version, manifest]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          set -euo pipefail
          V="${{ needs.resolve-version.outputs.simple_version }}"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Normalize and stage release assets
        run: |
          set -euo pipefail
          normalize_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          for d in artifacts/linux/x86_64 artifacts/linux/x86_32 artifacts/windows/x86_64 artifacts/windows/x86_32; do
            normalize_dir "$d"
          done
          mkdir -p release-assets
          stage() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "release-assets/${dest}"
            fi
          }
          stage artifacts/linux/x86_64/blazium-toolchain blazium-toolchain-linux-x86_64
          stage artifacts/linux/x86_64/blazium-toolchain.sig blazium-toolchain-linux-x86_64.sig
          stage artifacts/linux/x86_32/blazium-toolchain blazium-toolchain-linux-x86_32
          stage artifacts/linux/x86_32/blazium-toolchain.sig blazium-toolchain-linux-x86_32.sig
          stage artifacts/windows/x86_64/blazium-toolchain.exe blazium-toolchain-windows-x86_64.exe
          stage artifacts/windows/x86_32/blazium-toolchain.exe blazium-toolchain-windows-x86_32.exe
          test -f release-assets/blazium-toolchain-linux-x86_64
          test -f release-assets/blazium-toolchain-linux-x86_64.sig
          test -f release-assets/blazium-toolchain-linux-x86_32
          test -f release-assets/blazium-toolchain-linux-x86_32.sig
          test -f release-assets/blazium-toolchain-windows-x86_64.exe
          test -f release-assets/blazium-toolchain-windows-x86_32.exe
          ls -la release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-assets -type f | sort)
          test "${#FILES[@]}" -ge 2
          NOTES="blazium-toolchain ${VER}

          Official Blazium console toolchain manager (GPL-3.0-or-later).
          The MIT guest is embedded. Compilers are fetched by \`ps1 setup\`.

          | Platform | Arch | Asset |
          |----------|------|--------|
          | Linux | x86_64 | \`blazium-toolchain-linux-x86_64\` |
          | Linux | x86_32 | \`blazium-toolchain-linux-x86_32\` |
          | Windows | x86_64 | \`blazium-toolchain-windows-x86_64.exe\` |
          | Windows | x86_32 | \`blazium-toolchain-windows-x86_32.exe\` |

          CDN:
          - Manifest: https://cdn.blazium.app/toolchain/toolchain.json
          - Binaries: https://cdn.blazium.app/toolchain/{os}/{arch}/${VER}/

          Install via Hub or:
          \`\`\`
          blazium-cli update apply --product toolchain
          \`\`\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "blazium-toolchain ${VER}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release view "$TAG"
